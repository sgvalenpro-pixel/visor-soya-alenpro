name: Recolector mercado soya

# Corre 2 veces al día (hora Colombia, UTC-5):
#   14:00 UTC = 09:00 COL  -> cerca de la apertura de CBOT
#   19:30 UTC = 14:30 COL  -> cerca del cierre de CBOT
# También se puede disparar manualmente desde la pestaña Actions.
on:
  schedule:
    - cron: "0 14 * * 1-5"
    - cron: "30 19 * * 1-5"
  workflow_dispatch:

jobs:
  recolectar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar recolector
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node recolector.js
